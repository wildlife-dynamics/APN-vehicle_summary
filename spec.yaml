id: vehicle_summary

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc23"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: ecoscope-workflows-ext-apn
    version: "0.0.30"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    Vehicle Journey Summary Table.properties.journey_table.title: ""
    Vehicle Journey Summary Table.properties.journey_table.properties.table_config.properties.enable_sorting.default: true
    Vehicle Journey Summary Table.properties.journey_table.properties.table_config.properties.enable_filtering.default: true
    Vehicle Journey Summary Table.properties.journey_table.properties.table_config.properties.enable_download.default: true

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - id: user_details
    task: get_user_me
    partial:
      client: ${{ workflow.er_client.return }}

  - name: Define Base Maps
    id: base_maps
    task: set_base_maps

  - name: Set Locale
    id: locale
    task: set_locale
    partial:
      locale_str: es_ES  # Spanish (Spain) locale for date/number formatting

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Color Palette
    id: plot_palette
    task: set_color_palette

  # Fetch all "Libro Diario Vehicular" (Vehicle Daily Log) events from EarthRanger
  - name: Libro Diario Vehicular Events  # Vehicle Daily Log Events
    id: events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - priority
        - event_type
        - location
        - event_category
        - reported_by
        - serial_number
        - state
        - geometry
        - event_details
      event_types:
        - libro_diario_vehicular_v2
      include_details: true
      raise_on_empty: false
      include_updates: false
      include_null_geometry: true
      include_display_values: true
      include_related_events: false

  - title: Vehicle Summary Statistics Cards
    type: task-group
    description: "Create single value widgets for vehicle statistics."
    tasks:
      # Resolve enum display values in event_details using the EarthRanger v2 schema
      # (e.g. converts fuel type codes like "diesel_comun" to their display labels)
      - name: Process Event Details
        id: processed_events
        task: process_events_details
        partial:
          df: ${{ workflow.events.return }}
          client: ${{ workflow.er_client.return }}
          map_to_titles: false  # keep original field keys, not schema display titles
          ordered: true

      # Extract individual fields from the event_details JSON column into flat columns.
      # Each step passes its output as input to the next, building up the columns one by one.

      - name: Extract Vehicle Plate from Event Details  # Patente = vehicle licence plate
        id: extract_patente
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.processed_events.return }}
          column_name: event_details
          field_name_options:
            - Patente  # licence plate / vehicle identifier
          output_column_name: patente
          output_type: str

      - name: Extract Departure KM from Event Details  # KM at start of journey
        id: extract_km_salida
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_patente.return }}
          column_name: event_details
          field_name_options:
            - KM_de_salida  # odometer reading on departure
          output_column_name: km_salida
          output_type: float

      - name: Extract Arrival KM from Event Details  # KM at end of journey
        id: extract_km_llegada
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_km_salida.return }}
          column_name: event_details
          field_name_options:
            - Km_de_llegada  # odometer reading on arrival
          output_column_name: km_llegada
          output_type: float

      - name: Extract Litros Cargados from Event Details  # Fuel loaded (litres)
        id: extract_litros
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_km_llegada.return }}
          column_name: event_details
          field_name_options:
            - Litros_cargados  # litres of fuel loaded during the journey
          output_column_name: litros_cargados
          output_type: float

      - name: Extract Fuel Type from Event Details  # Tipo de combustible = fuel type
        id: extract_tipo_combustible
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_litros.return }}
          column_name: event_details
          field_name_options:
            - Tipo_de_combustible  # e.g. "diesel_comun" or petrol variants
          output_column_name: tipo_combustible
          output_type: str

      - name: Count Passengers from Event Details  # Pasajeros = array of passenger names; count its length
        id: extract_ocupantes
        task: extract_array_length_from_json_column
        partial:
          df: ${{ workflow.extract_tipo_combustible.return }}
          column_name: event_details
          field_name: Pasajeros  # array of passenger names from liderpatrulla choice list
          output_column_name: ocupantes  # stores the count as a number

      - name: Extract Trip Purpose from Event Details  # Motivo del desplazamiento = trip purpose / objective
        id: extract_objetivo
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_ocupantes.return }}
          column_name: event_details
          field_name_options:
            - Motivo_del_desplazamiento  # reason / purpose of the trip
          output_column_name: objetivo
          output_type: str

      - name: Format Trip Purpose
        id: format_objetivo
        task: join_list_column
        partial:
          df: ${{ workflow.extract_objetivo.return }}
          column_name: objetivo
          separator: ", "

      - name: Extract Trip Origin from Event Details  # Origen del desplazamiento = trip origin
        id: extract_origen
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.format_objetivo.return }}
          column_name: event_details
          field_name_options:
            - Origen_del_desplazamiento  # starting location of the trip
          output_column_name: origen
          output_type: str

      - name: Extract Destination from Event Details  # Destino = destination
        id: extract_destino
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_origen.return }}
          column_name: event_details
          field_name_options:
            - Destino  # end destination of the trip
          output_column_name: destino
          output_type: str

      - name: Extract Return Time from Event Details  # Regreso = return/arrival datetime
        id: extract_hora_llegada
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_destino.return }}
          column_name: event_details
          field_name_options:
            - Regreso  # return datetime (date-time field in v2 schema)
          output_column_name: regreso
          output_type: str

      # Calculate distance travelled per journey: km_llegada - km_salida
      - name: Calculate KM Travelled per Journey
        id: km_por_viaje  # km per trip
        task: apply_arithmetic_operation_over_rows
        partial:
          df: ${{ workflow.extract_hora_llegada.return }}
          column_a: km_llegada  # arrival odometer
          column_b: km_salida   # departure odometer
          output_column: km_viaje  # distance travelled
          operation: subtract

      # --- Stat card widgets ---

      # Widget: Number of unique vehicles used
      - name: Calculate Number of Vehicles Used
        id: total_vehicles
        task: dataframe_column_nunique
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column_name: patente

      - name: Create Single Value Widget for Total Vehicles
        id: total_vehicles_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nro. de Vehículos utilizados"  # No. of vehicles used
          decimal_places: 0
          data: ${{ workflow.total_vehicles.return }}

      # Widget: Total number of journeys (trips)
      - name: Calculate Total Journeys
        id: total_journeys
        task: dataframe_count
        partial:
          df: ${{ workflow.events.return }}

      - name: Create Single Value Widget for Total Journeys
        id: total_journeys_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total de desplazamientos"  # Total trips / journeys
          decimal_places: 0
          data: ${{ workflow.total_journeys.return }}

      # Widget: Total kilometres travelled across all journeys
      - name: Calculate Total KM Travelled
        id: total_km
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column_name: km_viaje

      - name: Create Single Value Widget for Total KM
        id: total_km_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total de km recorridos"  # Total kilometres travelled
          decimal_places: 0
          data: ${{ workflow.total_km.return }}

      # Widget: Total fuel loaded across all journeys (litres)
      - name: Calculate Total Fuel Used
        id: total_fuel
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column_name: litros_cargados

      - name: Total Fuel as Quantity
        id: total_fuel_q
        task: to_quantity
        partial:
          value: ${{ workflow.total_fuel.return }}
          unit: "L"

      - name: Create Single Value Widget for Total Fuel
        id: total_fuel_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total de combustible utilizado"
          decimal_places: 0
          data: ${{ workflow.total_fuel_q.return }}

      # Widget: Total diesel used — filter to rows where fuel type is "diesel_comun"
      - name: Filter Events for Diesel
        id: diesel_events
        task: filter_row_values
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column: tipo_combustible
          values:
            - "Diesel comun"  # resolved display value from EarthRanger enum

      - name: Calculate Total Diesel Used
        id: total_diesel
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.diesel_events.return }}
          column_name: litros_cargados

      - name: Total Diesel as Quantity
        id: total_diesel_q
        task: to_quantity
        partial:
          value: ${{ workflow.total_diesel.return }}
          unit: "L"

      - name: Create Single Value Widget for Total Diesel
        id: total_diesel_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total de diesel utilizado"
          decimal_places: 0
          data: ${{ workflow.total_diesel_q.return }}

      # Widget: Total petrol used — all journeys that are NOT diesel
      - name: Filter Events for Petrol
        id: petrol_events
        task: exclude_row_values
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column: tipo_combustible
          values:
            - "Diesel comun"  # exclude diesel; remainder is petrol

      - name: Calculate Total Petrol Used
        id: total_petrol
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.petrol_events.return }}
          column_name: litros_cargados

      - name: Total Petrol as Quantity
        id: total_petrol_q
        task: to_quantity
        partial:
          value: ${{ workflow.total_petrol.return }}
          unit: "L"

      - name: Create Single Value Widget for Total Petrol
        id: total_petrol_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total de nafta utilizada"
          decimal_places: 0
          data: ${{ workflow.total_petrol_q.return }}

      # Widget: Average number of occupants per journey
      - name: Calculate Average Occupants per Journey
        id: avg_occupants
        task: dataframe_column_mean
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column_name: ocupantes

      - name: Create Single Value Widget for Average Occupants
        id: avg_occupants_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Promedio de ocupantes por viaje"  # Average occupants per journey
          decimal_places: 1
          data: ${{ workflow.avg_occupants.return }}

  - title: Vehicle Journey Summary Table
    type: task-group
    description: "Create a per-journey summary table from vehicle events."
    tasks:
      # Select and rename columns for display in the dashboard table.
      # Spanish column names are translated to user-friendly display labels.
      - name: Select and Rename Columns for Journey Table
        id: journey_table_columns
        task: map_columns
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          raise_if_not_found: false
          retain_columns:
            - patente        # licence plate
            - time           # departure time
            - regreso        # return datetime
            - litros_cargados  # fuel loaded (litres)
            - tipo_combustible # fuel type
            - objetivo       # trip purpose
            - origen         # origin
            - destino        # destination
            - km_viaje       # distance travelled
          rename_columns:
            patente: "Matrícula / Vehículo"   # Licence Plate / Vehicle
            time: "Fecha de inicio"            # Start Date
            regreso: "Fecha de fin"            # End Date
            litros_cargados: "Combustible (L)" # Fuel (L)
            tipo_combustible: "Tipo de combustible"  # Fuel Type
            objetivo: "Objetivo"               # Trip Purpose
            origen: "Origen"                   # Origin
            destino: "Destino"                 # Destination
            km_viaje: "Distancia (km)"         # Distance (km)
          drop_columns: null

      - name: Draw Journey Summary Table
        id: journey_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.journey_table_columns.return }}

      - name: Persist Journey Table
        id: journey_table_html
        task: persist_text
        partial:
          text: ${{ workflow.journey_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: journey_table

      - name: Create Widget for Journey Table
        id: journey_table_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Resumen de Viajes por Vehículo"  # Journey Summary per Vehicle
          data: ${{ workflow.journey_table_html.return }}

  - title: Vehicle Usage Trends
    type: task-group
    description: "Bar charts showing distance and trip frequency trends."
    tasks:
      # Bar chart 1: total km travelled per vehicle per month (grouped bars, one colour per vehicle)
      - name: Draw Monthly Distance Bar Chart
        id: monthly_km_chart
        task: draw_time_series_bar_chart_grouped
        partial:
          dataframe: ${{ workflow.km_por_viaje.return }}
          color_palette: ${{ workflow.plot_palette.return }}
          x_axis: time
          y_axis: km_viaje       # distance per journey
          category: patente      # group/colour by vehicle
          agg_function: sum
          time_interval: month
          layout_style:
            title: null
            title_x: 0.5
            font_size: null
            font_color: null
            font_style: null
            plot_bgcolor: null
            showlegend: true
            hovermode: "x unified"
            legend_title: "Vehículo"  # Vehicle
            xaxis:
              title: "Mes"       # Month
              range: null
            yaxis:
              title: "Distancia (km)"  # Distance (km)
              range: null
            bargap: 0.2
            bargroupgap: 0.1

      - name: Persist Monthly Distance Chart
        id: monthly_km_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.monthly_km_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: monthly_km_chart

      - name: Create Widget for Monthly Distance Chart
        id: monthly_km_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Distancia recorrida por mes (km)"  # Distance travelled per month (km)
          data: ${{ workflow.monthly_km_chart_html.return }}

      # Bar chart 2: total number of trips per vehicle (one bar per vehicle, auto-coloured)
      - name: Count Trips per Vehicle
        id: trips_per_vehicle
        task: summarize_df
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          groupby_cols:
            - patente  # group by vehicle licence plate
          reset_index: true
          summary_params:
            - display_name: "Total de viajes"  # Total trips
              aggregator: count
              column: km_viaje
              decimal_places: 0

      - name: Draw Trips per Vehicle Bar Chart
        id: trips_per_vehicle_chart
        task: draw_bar_chart_colored
        partial:
          dataframe: ${{ workflow.trips_per_vehicle.return }}
          x_axis: patente          # one bar per vehicle
          y_axis: "Total de viajes"  # trip count
          color_palette: ${{ workflow.plot_palette.return }}
          text_template: null
          layout_style:
            title: null
            title_x: 0.5
            showlegend: false
            hovermode: "x"
            xaxis:
              title: "Vehículo"   # Vehicle
            yaxis:
              title: "Nro. de viajes"  # No. of trips
            bargap: 0.2

      - name: Persist Trips per Vehicle Chart
        id: trips_per_vehicle_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.trips_per_vehicle_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: trips_per_vehicle_chart

      - name: Create Widget for Trips per Vehicle Chart
        id: trips_per_vehicle_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nro. de Viajes por Vehículo"  # No. of Trips per Vehicle
          data: ${{ workflow.trips_per_vehicle_chart_html.return }}

  - name: Create Dashboard
    id: dashboard
    task: gather_apn_dashboard
    partial:
      details: ${{ workflow.workflow_details.return}}
      widgets:
        - ${{ workflow.total_vehicles_sv.return }}
        - ${{ workflow.total_journeys_sv.return }}
        - ${{ workflow.total_km_sv.return }}
        - ${{ workflow.total_fuel_sv.return }}
        - ${{ workflow.total_diesel_sv.return }}
        - ${{ workflow.total_petrol_sv.return }}
        - ${{ workflow.avg_occupants_sv.return }}
        - ${{ workflow.journey_table_sv.return }}
        - ${{ workflow.monthly_km_chart_sv.return }}
        - ${{ workflow.trips_per_vehicle_chart_sv.return }}
      time_range: ${{ workflow.time_range.return}}
